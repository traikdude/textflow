<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
      body { font-family: 'Inter', sans-serif; }
      .loader {
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top: 3px solid #ffffff;
        width: 20px;
        height: 20px;
        -webkit-animation: spin 1s linear infinite; /* Safari */
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] min-h-screen pb-24 md:pb-12 text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 safe-top">
      <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="bg-brand-600 p-2 rounded-lg text-white shadow-md">
            <i data-lucide="type" size="20" stroke-width="2.5"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-900 tracking-tight leading-none">TextFlow</h1>
            <p class="text-xs text-brand-600 font-medium">Smart Adjuster</p>
          </div>
        </div>
        <div class="flex items-center gap-1 text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">
          <i data-lucide="sparkles" size="12" class="text-brand-500"></i>
          <span>Gemini Powered</span>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 space-y-8">
      
      <!-- Input Section -->
      <section class="space-y-4">
        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Input Source</label>
            <button id="clearBtn" class="hidden text-xs text-gray-400 hover:text-red-500 flex items-center gap-1 transition-colors">
              <i data-lucide="x-circle" size="14"></i> Clear
            </button>
          </div>
          
          <div class="relative group">
            <textarea
              id="inputText"
              placeholder="Type or paste your text here to begin analysis..."
              class="w-full h-48 p-4 bg-white border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all resize-none text-base leading-relaxed text-gray-800 placeholder:text-gray-400 focus:outline-none"
            ></textarea>
            
            <button
              id="pasteBtn"
              class="absolute bottom-4 right-4 bg-white/90 backdrop-blur border border-gray-200 text-gray-600 p-2 rounded-lg shadow-sm hover:bg-gray-50 hover:text-brand-600 transition-all active:scale-95"
              title="Paste from Clipboard"
            >
              <i data-lucide="clipboard-paste" size="18"></i>
            </button>
          </div>

          <div class="flex justify-end">
            <div id="charCount" class="text-xs font-mono font-medium px-3 py-1 rounded-full bg-gray-100 text-gray-400">
              0 chars
            </div>
          </div>
        </div>
      </section>

      <!-- Controls Section -->
      <section class="space-y-4">
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100">
            
            <!-- Adjustment Type -->
            <div class="p-4 space-y-3 hover:bg-gray-50 transition-colors">
              <div class="flex items-center gap-2 text-brand-600 mb-1">
                <i data-lucide="settings-2" size="16"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Adjustment Type</span>
              </div>
              <div class="relative">
                <select id="modeSelect" class="w-full appearance-none bg-transparent font-medium text-gray-900 py-2 pr-8 focus:outline-none focus:ring-0 cursor-pointer text-sm">
                  <option value="REDUCE">Reduce Character Count</option>
                  <option value="ADD">Add Characters (Expand)</option>
                  <option value="EQUAL">Match Specific Length</option>
                  <option value="CONDENSE" selected>Condense to Target</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-gray-400">
                  <i data-lucide="chevron-down" size="16"></i>
                </div>
              </div>
              <p id="modeDesc" class="text-xs text-gray-500 h-8 md:h-4 overflow-hidden text-ellipsis leading-tight">
                Summarize heavily to fit tight constraints.
              </p>
            </div>

            <!-- Target Count -->
            <div class="p-4 space-y-3 hover:bg-gray-50 transition-colors">
              <div class="flex items-center gap-2 text-brand-600 mb-1">
                <i data-lucide="target" size="16"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Target Count</span>
              </div>
              <div class="relative">
                <select id="targetSelect" class="w-full appearance-none bg-transparent font-medium text-gray-900 py-2 pr-8 focus:outline-none focus:ring-0 cursor-pointer text-sm font-mono">
                  <!-- Options populated by JS -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-gray-400">
                  <i data-lucide="chevron-down" size="16"></i>
                </div>
              </div>
              <p class="text-xs text-gray-500 leading-tight">
                AI will aim for ±5% of this target.
              </p>
            </div>

          </div>
        </div>
      </section>

      <!-- Error Message -->
      <div id="errorMsg" class="hidden bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 flex items-start gap-3">
        <i data-lucide="alert-triangle" size="20" class="shrink-0 mt-0.5"></i>
        <div id="errorText" class="text-sm font-medium"></div>
      </div>

      <!-- Output Section -->
      <section id="outputSection" class="hidden space-y-3">
        <div class="flex items-center justify-between px-1">
          <label class="text-sm font-semibold text-gray-700 uppercase tracking-wider flex items-center gap-2">
             <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
             Processed Output
          </label>
          
          <div class="flex items-center gap-3 text-xs">
             <div class="flex items-center gap-1 text-gray-500 bg-white border border-gray-200 px-2 py-1 rounded-md shadow-sm">
                <i data-lucide="bar-chart-3" size="12"></i>
                <span id="percentChange">0% size</span>
             </div>
          </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-md overflow-hidden flex flex-col h-full min-h-[12rem]">
          <div id="outputText" class="flex-1 p-5 text-gray-800 leading-relaxed whitespace-pre-wrap font-sans text-base"></div>
          
          <div class="bg-gray-50 border-t border-gray-100 p-3 flex items-center justify-between">
              <div class="flex items-center gap-3 text-xs font-medium">
                  <span id="origCountDisplay" class="text-gray-400 line-through">0</span>
                  <i data-lucide="arrow-right" size="12" class="text-gray-400"></i>
                  <span id="newCountDisplay" class="text-brand-700 font-bold bg-brand-50 px-2 py-0.5 rounded-full">0 chars</span>
              </div>

              <button
                  id="copyBtn"
                  class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 bg-white text-gray-700 border border-gray-200 hover:bg-gray-100 hover:border-gray-300 shadow-sm"
              >
                  <i data-lucide="copy" size="16"></i>
                  <span id="copyText">Copy Text</span>
              </button>
          </div>
        </div>
      </section>

    </main>

    <!-- Sticky Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 z-20 md:sticky md:bottom-4 md:bg-transparent md:border-none md:p-0 md:max-w-3xl md:mx-auto md:mb-8 pointer-events-none">
      <div class="pointer-events-auto shadow-xl md:shadow-none rounded-2xl md:rounded-none">
          <button
          id="processBtn"
          disabled
          class="w-full py-4 px-6 rounded-xl flex items-center justify-center gap-3 font-bold text-lg shadow-lg md:shadow-brand-500/25 transition-all transform active:scale-[0.98] bg-gray-100 text-gray-400 cursor-not-allowed"
          >
            <i data-lucide="wand-2" size="24" class="icon-normal"></i>
            <div class="loader hidden"></div>
            <span id="btnText">Adjust Text</span>
          </button>
      </div>
    </div>

    <!-- Logic -->
    <script>
      // Initialize Lucide Icons
      lucide.createIcons();

      // DOM Elements
      const inputText = document.getElementById('inputText');
      const charCount = document.getElementById('charCount');
      const clearBtn = document.getElementById('clearBtn');
      const pasteBtn = document.getElementById('pasteBtn');
      const modeSelect = document.getElementById('modeSelect');
      const modeDesc = document.getElementById('modeDesc');
      const targetSelect = document.getElementById('targetSelect');
      const processBtn = document.getElementById('processBtn');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      const outputSection = document.getElementById('outputSection');
      const outputText = document.getElementById('outputText');
      const percentChange = document.getElementById('percentChange');
      const origCountDisplay = document.getElementById('origCountDisplay');
      const newCountDisplay = document.getElementById('newCountDisplay');
      const copyBtn = document.getElementById('copyBtn');
      const copyText = document.getElementById('copyText');
      const btnText = document.getElementById('btnText');
      const loader = document.querySelector('.loader');
      const iconNormal = document.querySelector('.icon-normal');

      // Constants
      const DESCRIPTIONS = {
        'REDUCE': 'Shorten text while keeping key points.',
        'ADD': 'Elaborate and add detail to reach target.',
        'EQUAL': 'Rewrite to match target length exactly.',
        'CONDENSE': 'Summarize heavily to fit tight constraints.'
      };

      const TARGET_COUNTS = [
        50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000,
        1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000,
        4000, 6000, 8000, 9000, 10000, 15000, 20000
      ];

      // Init
      function init() {
        // Populate Target Counts
        TARGET_COUNTS.forEach(count => {
          const opt = document.createElement('option');
          opt.value = count;
          opt.text = count.toLocaleString() + ' chars';
          if (count === 300) opt.selected = true;
          targetSelect.appendChild(opt);
        });
        
        lucide.createIcons();
      }

      // Event Listeners
      inputText.addEventListener('input', updateState);
      
      clearBtn.addEventListener('click', () => {
        inputText.value = '';
        updateState();
        inputText.focus();
      });

      pasteBtn.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          inputText.value = text;
          updateState();
        } catch (err) {
          alert('Could not access clipboard.');
        }
      });

      modeSelect.addEventListener('change', (e) => {
        modeDesc.textContent = DESCRIPTIONS[e.target.value];
      });

      processBtn.addEventListener('click', handleProcess);

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(outputText.textContent);
          copyText.textContent = 'Copied!';
          copyBtn.classList.remove('bg-white', 'text-gray-700');
          copyBtn.classList.add('bg-green-100', 'text-green-700', 'border-green-200');
          
          setTimeout(() => {
            copyText.textContent = 'Copy Text';
            copyBtn.classList.add('bg-white', 'text-gray-700');
            copyBtn.classList.remove('bg-green-100', 'text-green-700', 'border-green-200');
          }, 2000);
        } catch(err) { console.error(err); }
      });

      function updateState() {
        const len = inputText.value.length;
        charCount.textContent = len.toLocaleString() + ' chars';
        
        if (len > 0) {
          charCount.classList.remove('bg-gray-100', 'text-gray-400');
          charCount.classList.add('bg-brand-50', 'text-brand-700');
          clearBtn.classList.remove('hidden');
          
          processBtn.disabled = false;
          processBtn.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
          processBtn.classList.add('bg-gradient-to-r', 'from-brand-600', 'to-brand-500', 'text-white', 'hover:brightness-110');
        } else {
          charCount.classList.add('bg-gray-100', 'text-gray-400');
          charCount.classList.remove('bg-brand-50', 'text-brand-700');
          clearBtn.classList.add('hidden');
          
          processBtn.disabled = true;
          processBtn.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
          processBtn.classList.remove('bg-gradient-to-r', 'from-brand-600', 'to-brand-500', 'text-white', 'hover:brightness-110');
        }
      }

      function handleProcess() {
        const text = inputText.value;
        if (text.length < 10) {
          showError("Text is too short. Please enter at least 10 characters.");
          return;
        }

        setLoading(true);
        hideError();
        outputSection.classList.add('hidden');

        const mode = modeSelect.value;
        const target = parseInt(targetSelect.value);

        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .adjustTextContent(text, mode, target);
      }

      function onSuccess(result) {
        setLoading(false);
        const originalLen = inputText.value.length;
        const newLen = result.length;
        
        outputText.textContent = result;
        origCountDisplay.textContent = originalLen.toLocaleString();
        newCountDisplay.textContent = newLen.toLocaleString() + ' chars';

        const change = originalLen > 0 ? Math.round(((newLen - originalLen) / originalLen) * 100) : 0;
        percentChange.textContent = (change > 0 ? '+' : '') + change + '% size';

        outputSection.classList.remove('hidden');
        outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function onFailure(error) {
        setLoading(false);
        showError(error.message);
      }

      function setLoading(isLoading) {
        if (isLoading) {
          processBtn.disabled = true;
          iconNormal.classList.add('hidden');
          loader.classList.remove('hidden');
          btnText.textContent = 'Processing...';
        } else {
          processBtn.disabled = false;
          iconNormal.classList.remove('hidden');
          loader.classList.add('hidden');
          btnText.textContent = 'Adjust Text';
        }
      }

      function showError(msg) {
        errorText.textContent = msg;
        errorMsg.classList.remove('hidden');
      }

      function hideError() {
        errorMsg.classList.add('hidden');
      }

      // Start
      init();
    </script>
  </body>
</html>
